# ✈️ 日本傳統航空便宜機票提醒設定（由網頁控制台產生：https://ntcloudy.github.io/jp-flight-alert/）
# 價格＝每人、來回、含稅（新台幣）｜時間＝當地時間｜instant_max 馬上寄、digest_max 每日整理、anomaly_pct 比平常便宜幾 %
# muted：不再通知的行程｜paused_until：暫停通知到這天（YYYY-MM-DD）
alerts:
  instant_max: 8000
  digest_max: 10000
  anomaly_pct: 20
  digest_hour: 8
  renotify_drop: 300
  paused_until: ""
schedule:
  interval_hours: 3
trip:
  origins: ["TPE", "TSA"]
  destinations: ["NRT", "HND", "KIX", "NGO", "FUK", "CTS", "OKA", "SDJ", "HKD", "AOJ", "KMQ", "TOY", "HIJ", "OKJ", "TAK", "MYJ", "KMJ", "KOJ", "KMI", "FSZ", "IBR", "KIJ", "HNA", "AXT", "ISG", "UKB", "KKJ"]
  min_days: 4
  max_days: 8
  prefer_days: 5
  lead_days: 2
  horizon_days: 180
  adults: 2
  nonstop_only: true
  airlines: ["CI", "BR", "JX", "AE", "JL", "NH", "CX"]
outbound:
  depart_earliest: "10:00"
  depart_latest: "14:00"
  arrive_ideal: "18:00"
  arrive_latest: "18:30"
inbound:
  depart_earliest: "13:00"
  depart_latest: "15:00"
  arrive_ideal: "19:00"
  arrive_latest: "20:00"
promo:
  enabled: true
muted:
  - "TPE-CTS|2026-10-19|2026-10-23"
