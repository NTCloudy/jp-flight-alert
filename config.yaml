# ✈️ 日本傳統航空便宜機票提醒設定（由網頁控制台產生：https://ntcloudy.github.io/jp-flight-alert/）
# 價格＝每人、來回、含稅（新台幣）｜時間＝當地時間｜instant_max 馬上寄、digest_max 每日整理、anomaly_pct 比平常便宜幾 %｜digest_enabled：要不要寄每日整理
# muted：不再通知的行程｜paused_until：暫停通知到這天（YYYY-MM-DD）
alerts:
  instant_max: 8000
  digest_max: 10000
  anomaly_pct: 50
  digest_hour: 18
  digest_enabled: false
  renotify_drop: 2000
  paused_until: ""
schedule:
  interval_hours: 3
trip:
  origins: ["TPE", "TSA"]
  destinations: ["NRT", "HND", "KIX", "UKB", "NGO", "FUK", "KKJ", "CTS", "HKD", "OKA", "SDJ", "AOJ", "AXT", "HNA", "KIJ", "IBR", "FSZ", "TOY", "KMQ", "HIJ", "OKJ", "TAK", "MYJ", "KMJ", "KOJ", "KMI"]
  min_days: 4
  max_days: 8
  prefer_days: 5
  lead_days: 7
  horizon_days: 180
  adults: 2
  nonstop_only: true
  airlines: ["CI", "BR", "JX", "AE", "JL", "NH", "CX"]
outbound:
  depart_earliest: "10:00"
  depart_latest: "14:00"
  arrive_ideal: "14:00"
  arrive_latest: "18:30"
inbound:
  depart_earliest: "13:00"
  depart_latest: "15:30"
  arrive_ideal: "18:00"
  arrive_latest: "20:00"
promo:
  enabled: true
# 廉航（另外寄信，不影響上面傳統航空）：票價＋20kg 託運行李（去回各 1 件，估價）每人來回 < max_total 才通知
# bag_fees：每人每段 20kg 預購價估算（新台幣）；沒列到的廉航用 bag_fee_default
lcc:
  enabled: true
  max_total: 5000
  bag_kg: 20
  bag_fee_default: 1200
  bag_fees: {"IT": 950, "MM": 950, "GK": 950, "JQ": 950, "TR": 950, "D7": 950, "AK": 950, "FD": 950, "Z2": 950, "VJ": 600, "VZ": 600}
  airlines: ["IT", "MM", "GK", "JQ", "TR", "ZG", "IJ", "UO", "D7", "AK", "FD", "Z2", "VJ", "VZ", "SL", "BX", "LJ", "TW", "ZE", "RS"]
