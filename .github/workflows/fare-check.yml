name: Fare Check (manual)

# One-way economy fares for specific dates (Google Flights, TWD, 1 adult) - e.g. to judge a rebooking.
on:
  workflow_dispatch:
    inputs:
      route:
        description: "航線（例如 TPE-KIX）"
        default: "TPE-KIX"
      dates:
        description: "日期，逗號分隔（例如 2026-10-22,2026-10-23）"
        required: true
      airline:
        description: "航空公司代碼（例如 CX；留空 = 全部）"
        default: "CX"

permissions:
  contents: read

jobs:
  fares:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fares
        run: python scripts/fare_check.py --route "${{ inputs.route }}" --dates "${{ inputs.dates }}" --airline "${{ inputs.airline }}"
