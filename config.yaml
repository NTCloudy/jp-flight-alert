# ✈️ 日本傳統航空便宜機票提醒設定（由網頁控制台產生：https://ntcloudy.github.io/jp-flight-alert/）
# 價格＝每人、來回、含稅（新台幣）｜時間＝當地時間｜instant_max 馬上寄、digest_max 每日整理、anomaly_pct 比平常便宜幾 %
# muted：不再通知的行程｜paused_until：暫停通知到這天（YYYY-MM-DD）
alerts:
  instant_max: 8000
  digest_max: 10000
  anomaly_pct: 30
  digest_hour: 18
  renotify_drop: 2000
  paused_until: ""
schedule:
  interval_hours: 3
trip:
  origins: ["TPE", "TSA"]
  destinations: ["NRT", "HND", "KIX", "UKB", "NGO", "FUK", "KKJ", "CTS", "HKD", "OKA", "SDJ", "AOJ", "AXT", "HNA", "KIJ", "IBR", "FSZ", "TOY", "KMQ", "HIJ", "OKJ", "TAK", "MYJ", "KMJ", "KOJ", "KMI"]
  min_days: 4
  max_days: 8
  prefer_days: 5
  lead_days: 7
  horizon_days: 180
  adults: 2
  nonstop_only: true
  airlines: ["CI", "BR", "JX", "AE", "JL", "NH", "CX"]
outbound:
  depart_earliest: "10:00"
  depart_latest: "14:00"
  arrive_ideal: "14:00"
  arrive_latest: "18:30"
inbound:
  depart_earliest: "13:00"
  depart_latest: "15:30"
  arrive_ideal: "18:00"
  arrive_latest: "20:00"
promo:
  enabled: true
muted:
  - "TPE-SHI|2027-03-06|2027-03-10"
  - "TPE-SHI|2026-11-02|2026-11-09"
  - "TPE-SHI|2027-03-01|2027-03-06"
  - "TPE-SHI|2027-03-08|2027-03-15"
  - "TSA-HND|2027-04-06|2027-04-09"
  - "TSA-HND|2027-04-07|2027-04-12"
  - "TSA-HND|2027-04-11|2027-04-16"
  - "TSA-HND|2027-04-12|2027-04-17"
  - "TSA-HND|2027-04-14|2027-04-19"
  - "TSA-HND|2027-04-18|2027-04-22"
  - "TSA-HND|2027-04-18|2027-04-21"
  - "TSA-HND|2027-04-19|2027-04-23"
  - "TSA-HND|2027-04-19|2027-04-22"
