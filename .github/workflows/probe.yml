name: Probe (Google Flights from GitHub)

on:
  workflow_dispatch:
    inputs:
      gap:
        description: "每次查詢間隔秒數"
        default: "6"
      max_calls:
        description: "最多查詢幾次"
        default: "30"
      script:
        description: "probe 或 diag"
        default: "probe"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: |
          if [ "${{ github.event.inputs.script }}" = "diag" ]; then
            python scripts/diag.py
          else
            python scripts/probe.py --gap "${{ github.event.inputs.gap }}" --max-calls "${{ github.event.inputs.max_calls }}"
          fi
